# Copy to secret.yaml, replace every change-me, then:
#   kubectl apply -f deploy/k8s/secret.yaml
# Do not commit secret.yaml.
# Gmail must use an app password, not the account login password.
apiVersion: v1
kind: Secret
metadata:
  name: send-issue-email-secret
  namespace: send-issue-email
type: Opaque
stringData:
  SMTP_USERNAME: agent@arko.global
  SMTP_PASSWORD: change-me-app-password
