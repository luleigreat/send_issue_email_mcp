# Non-secret settings. SMTP username and password live in send-issue-email-secret.
# MCP_PATH must stay /. arko-chat-agent and other clients POST that URL.
apiVersion: v1
kind: ConfigMap
metadata:
  name: send-issue-email-config
  namespace: send-issue-email
data:
  TARGET_EMAIL: services@arko.global
  SMTP_HOST: smtp.larksuite.com
  SMTP_PORT: "465"
  SMTP_USE_SSL: "true"
  SENDER_EMAIL: agent@arko.global
  SENDER_NAME: ARKO Chat Agent
  MCP_TRANSPORT: streamable-http
  MCP_HOST: 0.0.0.0
  MCP_PORT: "8765"
  MCP_PATH: /
